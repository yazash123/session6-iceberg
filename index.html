var FULLD={"R01": "<p><strong>AI is very good at changing your mind.<\/strong> Last year, peer-reviewed studies found that a person’s political views could change more strongly after talking to a chatbot than by watching an ordinary campaign advert. AI is also being used by companies more and more to achieve their own goals: to get more attention, sell more products and sometimes even persuade people to see the world in ways that suit them.<\/p><p><strong>You’re also not very good at spotting when AI changes your point of view.<\/strong> Research has found that chatbots with built-in bias can shift opinions without users realising it — and that people often can’t spot adverts hidden in an AI’s answers.<\/p><p><strong>Political influence can also happen when nobody plans it.<\/strong> For example, a study on 24 different chatbots found that their answers to political questions were all quite similar, with no evidence that any bias was built-in intentionally.<\/p><p><strong>Currently, at least 1 major AI chatbot shows adverts.<\/strong> For now, these are kept separate from the answers, but experts are worried that paid messages, or a company’s preferred views could one day be mixed into the answers themselves. A wider worry — that AI could weaken the shared facts at the foundations of democracy — is emphasised in other risks on the map.<\/p>", "R02": "<p><strong>Public life often works by inviting people to write in:<\/strong> planning applications, government consultations, committee evidence, court &amp; legal filings, complaints, grant applications — the list goes on! A lot of this assumes that it takes some human-sized amount of effort to write a letter, so <strong>the pile of letters ought to stay roughly human-sized.<\/strong> However, because of AI, this assumption is no longer true and <strong>public processes and legal systems are at risk of disruption and manipulation.<\/strong><\/p><p><strong>Having the time and effort to write a letter may not be a fair barrier to public life in the first place.<\/strong> After all, it favours people who have time, money and employees. But it did make it harder for any one participant to flood the room. Now that AI can overcome this <strong>‘effort filter’<\/strong>, real people are using it to take part in public processes in ways they couldn’t before, but it could break systems which depend on the effort filter to function properly.<\/p><p>The US got a taste of this in June 2025, where an air quality board in California was deciding on whether to tighten rules on transitioning from gas heaters to electric ones. Just before the vote, they <strong>received over 20,000 emails from an ‘AI-powered grassroots advocacy platform’ opposing the motion<\/strong> and the board decided against passing the motion. However, many weeks later, most of the named senders were not available to respond to investigators, or the few who did respond knew little or nothing about the letters their names were attached to.<\/p>", "R03": "<p>Children increasingly are choosing to use AI tools for tutoring and mental health support over speaking with parents, teachers or friends. Some children form strong attachments to always-available, agreeable AI companions and can begin to prefer them to real relationships.<\/p><p>Social skills (like empathy and conflict resolution) are usually learnt through real human interactions, so as these AI systems enter children’s developing minds and daily environments, it can affect how kids relate to family and peers.<\/p>", "R05": "<p><strong>Before a powerful AI model is released to the public, testers attempt to check it for dangers.<\/strong> But unlike safety tests on things like cars &amp; aeroplanes, the companies creating AI get to decide for themselves who becomes a tester, how long they have to investigate and what permissions they are given.<\/p><p>This is because these companies — a tiny number of them, in the United States and China — are the only ones with the computing power, the data and the access that is needed to test whether it’s safe in the first place. The UK’s AI Security Institute has over 100 technical staff who can test models, but it currently relies on voluntary agreements with powerful US companies and ongoing goodwill — which can make it harder to publish findings the companies won’t like.<\/p><p>This risk is connected to a wider problem of AI companies concentrating economic power. This is covered under “AI companies too big to regulate”.<\/p>", "R06": "<p>Some AI companies release their models openly, so that anyone can download, run and change them. This has some benefits, as it means smaller researchers and organisations can study and build on them. <strong>But it also means the safety features can be removed.<\/strong> As open models catch up with the best closed ones, this now includes some of the most powerful AI systems ever developed.<\/p><p>These <strong>safety guardrails prevent<\/strong> you from using a model to make <strong>weapons of mass destruction<\/strong>, or launch <strong>cyberattacks<\/strong>, or to <strong>scam<\/strong> others and commit <strong>fraud<\/strong>, or fabricate <strong>deepfakes<\/strong>, or <strong>harm children<\/strong> or yourself. A study in 2024, however, showed that these guardrails can be undone for pennies’ worth of compute — and there are thousands of modified AI models on the internet available to download already.<\/p><p>The problem is that <strong>nobody is responsible for stopping this.<\/strong> Most AI laws give responsibilities to a company that builds a model and an organisation that uses it. Someone who makes cheap changes to a model and re-shares it falls outside these laws, and once a model is on someone else’s private computer, no company or government can see what it’s used for or take it back.<\/p>", "R07": "<p class=\"lede\">Many people want AI systems to be aligned with our intentions and under our control. There is a risk, however, that a model could cause harm and be difficult to switch off.<\/p><p>Right now, people can still follow how an AI model is reasoning and acting, and step in if needed. <strong>But as AI begins to be used to help build newer AI, it could improve faster than safety checks and regulators can keep up.<\/strong> In other words, by the time they decided to switch a model off, it may be too late.<\/p><p>AI builds AI by writing pieces of code, creating synthetic training data and suggesting improvements to software engineers. As this gets more involved, <strong>it can be difficult for engineers to track what’s changing and why<\/strong> — and without the ability to notice and respond, workers can’t oversee and control an AI’s activity.<\/p><p>Before publicly announcing the existence of a new model, AI companies use and test it themselves — and they don’t have to say what problems they find. In the UK, one public body does have the expertise to follow the behaviour of frontier AI models — the AI Security Institute — however <strong>it has no power to compel access.<\/strong> This is outlined in another risk in this cluster on the risk map.<\/p><p>This issue emphasises the limits in oversight and control of new AI models. A related scenario, about countries racing to use AI to build AI, and in the process developing a model which is misaligned with human intentions and wellbeing, was discussed by experts but did not make the final map of 13 risks.<\/p>", "R08": "<p>People are handing AI years of people’s personal data: searches, purchases, conversations, health and location information. This risks AI learning so much about a person that they can accurately model the trajectory of their life, including predicting their habits, weaknesses and future behaviour. This may give AI companies the ability to control citizens across the globe.<\/p>", "R09": "<p>The ability of AI to make sense of large amounts of military intelligence increases the risk that it is used to find the whereabouts of leaders, plan and simulate actions to go after them and then follow through on these plans with more precision and fewer casualties. In 2026, the US captured the leader of Venezuela and killed Iran’s Supreme Leader after AI tools were used to map his daily movements and help confirm his location. As this becomes easier, powerful people in government may put military might over laws or diplomacy.<\/p><p>The White House Deputy Chief of Staff for Policy and Homeland Security Advisor, Stephen Miller, said in January 2026:<\/p><blockquote><em>“We live in a world in which, you can talk about international niceties and everything else, but we live in a world, in the real world — that is governed by strength, that is governed by force, that is governed by power. These are the iron laws of the world since the beginning of time.”<\/em><\/blockquote><p><strong>The same capability is also used on people in urban warfare, at great volume.<\/strong> Throughout 2026, US forces have been using an AI-fused targeting system supplied by Palantir to help process up to 1,000 targets in a single day by combining satellite images, drone footage and human intelligence reports into targeting plans. On February 28, 2026, a strike planned using this system killed over 120 young girls in Shajareh, Iran — at a primary school wrongly connected to a nearby naval base.<\/p>", "R10": "<p>Countries have always competed to build more powerful military technology. Recent AI developments raise the risk of a runaway version of this, where agentic AI systems (those that act on their own) become a part of the command-and-control of large militaries.<\/p><p>This could lead to:<\/p><ol><li><strong>Automation.<\/strong> Someone asked to review a thousand AI-recommended targets at once may simply defer to the machine rather than check each one.<\/li><li><strong>Escalation.<\/strong> Countries could lose control of their militaries to unpredictable and flawed AI systems. If these systems aren’t explicitly programmed to seek peace and de-escalate conflicts, they could quickly trigger a catastrophic war.<\/li><li><strong>Unaccountability.<\/strong> Countries could get away with war crimes. Because international humanitarian law is written in terms of human intentions and clear chains of command, the picture gets muddied when life-or-death decisions are made across a system with plausible deniability.<\/li><\/ol>", "R11": "<p>AI has become so good at biology and chemistry that it can act like an expert lab assistant, giving thousands of people the knowledge of an elite, PhD-level scientist. This lowers the barrier to bad actors developing chemical &amp; biological weapons, including new viruses and toxins which could prove deadly in densely populated cities and places with limited public health systems.<\/p>", "R12": "<p>An AI model can be built in one country and used by people all over the world. <strong>If something goes wrong, the AI company can be far away and hard for local authorities to reach.<\/strong><\/p><p>Right now, most AI incidents come to light through news stories, social media posts and whistleblowers, not through any system built to spot them. Companies have little reason to volunteer bad news. <strong>Countries don’t agree on what counts as an AI incident<\/strong> and those with no AI safety body of their own may have <strong>no way to notice that something has gone wrong.<\/strong><\/p><p>There is no agreed system for countries to share and respond to incidents and no requirement for US companies to report misuse to the UK government. In September 2026, the US and China agreed to set up a channel to talk about AI incidents. The UK is not part of it, and no details have been published.<\/p><p>In June 2025, a US AI company banned a Canadian user’s account over violent activity, but did not tell the police, saying it saw no sign of an imminent attack. In February 2026, that person carried out a deadly attack. The company has since changed its rules on contacting police. The risk is that <strong>without agreed rules on who tells whom, governments only react after a disaster instead of preparing in advance.<\/strong><\/p>", "R14": "<p>The economy as a whole has come to rely on a small number of AI companies succeeding.<\/p><p>A small number of very big companies are carrying a lot of the economy on their backs. In the USA, the ten largest companies (mostly tech firms invested in AI) make up nearly 40% of the total value of the largest 500 companies. Investment in things like data centres accounted for about 92% of the growth in the US economy, despite being only about 4% of value, according to a Harvard economist.<\/p><p>These companies also fund each other, making demand for AI products look bigger than it might otherwise be. The Bank of England has warned that AI economic predictions may be inflated by these ‘circular’ deals.<\/p><p>When a handful of companies are essential to growth, governments want them to keep succeeding and are reluctant to restrict them. Any rule that might slow these companies down becomes costly to pass, and may affect the country’s overall economic performance. But if companies are ‘too big to fail’, they’re very hard to regulate.<\/p><p>As AI gets built into the workforce — into hospitals, courts, schools, transport and government services — the companies that control the essential building blocks of AI (AI models, advanced computer chips, special software, computing power, energy &amp; land) can set the terms everyone else must follow.<\/p><p>Unlike national infrastructure like water or electricity, AI companies are not required to keep prices controlled, serve wide groups of people and to supply their service even when it isn’t profitable to them.<\/p><p>The long-term risk is that a lasting arrangement is formed, where countries don’t learn to build their own AI, and instead keep renting it from a few companies forever more. But once a government is running its key institutions on AI that it rents from a company it doesn’t control, it may be giving away its power.<\/p>", "R15": "<p>As AI keeps giving useful advice and recommendations, people and institutions may move from trusting it → to relying on it → to depending on it completely, and in the process stop using human judgement to think things through fully themselves.<\/p><p>Many institutions, such as hospitals, courts and the armed forces, are now training people to use AI systems in their work, potentially risking their ability to reach a decision without it. Over time an institution may even lose the capacity to check the software which shapes AI analysis and recommendations, as fewer and fewer people within it remember another way.<\/p>"};

  g.style.color=getComputedStyle(b).color;g.style.width=b.offsetWidth+'px';g.style.top=b.offsetTop+'px';g.style.left=b.offsetLeft+'px';

function go(i,way){
  if(i<0||i>=STEPS.length||i===S.step)return;
  var from=STEPS[S.step],to=STEPS[i];
  if(!way&&from.layer&&to.layer&&from.dir===to.dir)way=DEPTH[to.layer]>DEPTH[from.layer]?'dn':'up';
  if(way&&!REDUCE)ghost(way);
  S.step=i;S.xopen=false;S.kind='';save();
  if(way)$('pbody').setAttribute('data-way',way);
  render();
  try{window.scrollTo({top:0,behavior:REDUCE?'auto':'smooth'});}catch(e){}
}

function openEditor(node){
  var k=node.getAttribute('data-copy');if(!k||!(k in DEF))return;
  EDKEY=k;EDANCHOR=node;
  var ed=$('ed'),ta=$('edta');
  ta.value=raw(k);
  var tips=[];if(MULTI[k])tips.push('Each line is a separate question. Shift + Enter starts a new line.');
  if(HINTS[k])tips.push(HINTS[k]);else if(/\*/.test(DEF[k]))tips.push('*Asterisks* make words bold.');
  if(/\{\w+\}/.test(DEF[k]))tips.push('Keep the {curly} bits: they are filled in for you.');
  $('edhint').textContent=tips.join(' ');$('edhint').hidden=!tips.length;
  $('edreset').hidden=!has(k);
  ed.hidden=false;
  var r=node.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight,w=Math.min(560,vw-32);
  ed.style.width=w+'px';
  ed.style.left=Math.max(16,Math.min(r.left,vw-w-16))+'px';
  var h=ed.offsetHeight,top=r.bottom+8;if(top+h>vh-16)top=Math.max(16,r.top-h-8);
  ed.style.top=top+'px';
  ta.style.height='auto';ta.style.height=Math.min(260,Math.max(48,ta.scrollHeight+4))+'px';
  ta.focus();ta.select();
}
function closeEditor(){$('ed').hidden=true;var a=EDANCHOR;EDKEY=null;EDANCHOR=null;if(a&&a.isConnected&&a.focus&&a.tabIndex>=0)try{a.focus({preventScroll:true});}catch(e){}}
function commitEditor(reset){
  var k=EDKEY;if(!k)return;
  var v=reset?'':$('edta').value.replace(/ /g,' ').replace(/[ \t]+\n/g,'\n').trim();
  if(!MULTI[k])v=v.replace(/\s*\n\s*/g,' ');
  var before=raw(k);
  if(v===''||v===DEF[k])delete COPY[k];else COPY[k]=v;
  closeEditor();
  if(raw(k)!==before){render();queueSave();}
}
function queueSave(){setStatus('Change made. Saving in a moment…');clearTimeout(saveTimer);saveTimer=setTimeout(doSave,1800);}
function buildDoc(){
  var json=JSON.stringify(COPY).replace(/</g,'\\u003c');
  var SC='scr'+'ipt';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>'+esc(document.title||'HotP Iceberg Futures')+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    '<style id="css">'+CSS_SRC+'</style>\n<div id="root"></div>\n'+
    '<'+SC+' type="application/json" id="copy">'+json+'</'+SC+'>\n'+
    '<'+SC+' type="application/json" id="experts">'+EXP_SRC+'</'+SC+'>\n'+
    '<'+SC+' id="app">'+APP_SRC+'</'+SC+'>\n</body></html>';
}
function doSave(){
  if(!$('ed').hidden){saveTimer=setTimeout(doSave,1500);return;}
  if(!ART){setStatus('Changes show here only. This view can’t save them.');return;}
  setStatus('Saving for everyone…');
  try{sessionStorage.setItem('hotp-ice-edit',EDITMODE?'1':'');}catch(e){}
  ART.publish(buildDoc()).then(function(){setStatus('Saved. Reloading…');},function(e){
    var c=e&&e.code;
    if(c==='conflict')setStatus('A newer version was saved first. Loading it now: check your change is there.');
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'){CAN=false;EDITMODE=false;applyCan();setStatus('This view is read-only, so the change wasn’t saved.');$('edbar').hidden=false;$('edtoggle').hidden=true;}
    else if(c==='rate_limited'){setStatus('Saving is busy. Trying again shortly…');saveTimer=setTimeout(doSave,8000);}
    else if(!retried&&(c==='upstream_error'||!c)){retried=true;saveTimer=setTimeout(doSave,1500+Math.random()*1500);}
    else setStatus('Couldn’t save the change. Reload the page and try again.');
  });
}
document.addEventListener('click',function(e){
  if(!CAN||!EDITMODE)return;
  var t=e.target;if(!t.closest||t.closest('#ed,#edbar'))return;
  var n=t.closest('[data-copy]');if(!n)return;
  e.preventDefault();e.stopPropagation();openEditor(n);
},true);
document.addEventListener('dblclick',function(e){
  if(!CAN||EDITMODE)return;
  var t=e.target;if(!t.closest||t.closest('#ed,#edbar,button,label,textarea,input,select,a,.note'))return;
  var n=t.closest('[data-copy]');if(!n)return;
  e.preventDefault();try{window.getSelection().removeAllRanges();}catch(x){}openEditor(n);
});
document.addEventListener('mousedown',function(e){if(!$('ed').hidden&&!e.target.closest('#ed'))commitEditor(false);},true);
$('edta').addEventListener('keydown',function(e){
  if(e.key==='Escape'){e.preventDefault();closeEditor();}
  else if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commitEditor(false);}
});
$('edsave').addEventListener('click',function(){commitEditor(false);});
$('edcancel').addEventListener('click',closeEditor);
$('edreset').addEventListener('click',function(){commitEditor(true);});
$('edtoggle').addEventListener('click',function(){EDITMODE=!EDITMODE;try{sessionStorage.setItem('hotp-ice-edit',EDITMODE?'1':'');}catch(e){}applyCan();});
window.addEventListener('beforeunload',function(e){if(saveTimer&&$('edstatus').textContent.indexOf('moment')>=0){e.preventDefault();e.returnValue='';}});

render();
(function(){
  if(!window.claude||!window.claude.use)return;
  window.claude.use('artifact').then(function(a){
    if(!a)return;ART=a;
    return window.claude.use('user').then(function(u){return u?u.canEdit():true;},function(){return true;}).then(function(ok){CAN=!!ok;applyCan();});
  }).catch(function(){});
})();
</script>
