/* Layout: the iceberg is the map, the white panel is the facilitator's script. Down the left flank for 2060 gone wrong, up the right flank for 2060 gone well.
   House of the People kit: light blue ground, square tiles, brand colours, Adelphe for the questions, Poppins for everything else. One light look by choice, matching Session 5. */
:root{
  --sky:#C0E8F8; --sea:#5878A0; --deep:#1C3150; --ice:#FFFFFF; --ice-under:#DDF2FA;
  --wrong:#E06050; --wrong-ink:#A8123F; --well:#F0E060; --well-ink:#2E5E28;
  --bar:#387030; --pick:#E0C060; --purple:#B868C0; --pink:#E078B0; --orange:#E08850;
  --ink:#0A0A0A; --mute:#3A474D; --line:rgba(10,10,10,.18); --paper:#FFFFFF; --soft:#F2F8FB;
  --ff-serif:"Adelphe","GT Sectra",Georgia,serif;
  --ff-sans:"BBB Poppins TN","Poppins",system-ui,-apple-system,sans-serif;
  --max:1440px; --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
body{background:var(--sky);color:var(--ink);font-family:var(--ff-sans);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky)}
*{box-sizing:border-box;border-radius:0}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:active:not(:disabled){transform:translateY(2px)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-weight:700;font-size:12px;line-height:1.2;letter-spacing:.09em;text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* masthead: three tiles, dark / medium / light */
.mast{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;margin-top:clamp(10px,1.4vw,18px)}
.mast>div{padding:10px clamp(14px,2vw,26px);display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.mast .t1{background:var(--sea);color:var(--ice)}
.mast .t2{background:var(--purple)}
.mast .t3{background:var(--pick);flex-direction:row;align-items:center;gap:10px}
.mast h1{font-family:var(--ff-serif);font-weight:400;font-size:clamp(26px,1rem + 1.3vw,38px);line-height:1;letter-spacing:-.01em}
.mast h1 b{font-family:var(--ff-sans);font-weight:700;letter-spacing:-.02em}
.mast .rk{font-family:var(--ff-serif);font-size:clamp(17px,.9rem + .4vw,22px);line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mast label{font-weight:700;font-size:14px}
.mast select{border:0;background:var(--paper);padding:8px 10px;font-weight:700}
@media(max-width:760px){.mast{grid-template-columns:1fr 1fr}.mast .t1{grid-column:1/-1}}

/* step bar */
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sky)}
.steps ol{display:flex;flex-wrap:wrap;scrollbar-width:none;background:var(--bar)}
.steps ol::-webkit-scrollbar{display:none}
.steps button{border:0;background:none;color:var(--ice);font-weight:700;font-size:15px;white-space:nowrap;padding:11px clamp(6px,.75vw,12px);display:flex;align-items:center;gap:7px}
.steps button:hover{background:rgba(255,255,255,.14)}
.steps button[aria-current="step"]{background:var(--pick);color:var(--ink)}
.steps .dir{display:inline-block;width:10px;height:10px}
.steps .dn .dir{background:var(--wrong)} .steps .up .dir{background:var(--well)}
.steps .sep{width:2px;background:rgba(255,255,255,.35);margin:8px 2px}
.steps .n{font-weight:400;font-size:12px;background:rgba(255,255,255,.22);padding:0 7px;border-radius:999px}
.steps [aria-current="step"] .n{background:rgba(0,0,0,.12)}

.demo{background:var(--orange);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 16px;font-size:15px}
.demo button{border:0;background:var(--ink);color:var(--ice);font-weight:700;padding:8px 14px}

main{padding-block:clamp(10px,1.4vw,18px) 60px}
.work{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.5fr);gap:clamp(14px,2vw,28px);align-items:start}
@media(max-width:900px){.work{grid-template-columns:minmax(0,1fr)}}

/* the iceberg */
.berg{position:sticky;top:56px;background:var(--deep);min-width:0}
@media(max-width:900px){.berg{position:static}}
.berg .bgd{background:var(--deep);overflow:hidden}
.berg svg{display:block;margin:0 auto;overflow:visible;width:100%;height:auto;max-height:calc(100vh - 210px)}
@media(max-width:900px){.berg svg{max-height:44vh}}
.berg .dim{fill:#000;opacity:0;transition:opacity .45s var(--ease)}
.berg .dim.on{opacity:.42}
.berg .lab{font-family:var(--ff-sans);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.berg .cnt text{font-family:var(--ff-sans);font-weight:700;font-size:15px}
#mk{transition:transform .7s var(--ease)}
@media(prefers-reduced-motion:reduce){#mk,.berg .dim{transition:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;background:var(--sea);color:var(--ice);font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:6px}

/* the panel */
.panel{background:var(--paper);min-width:0;display:flex;flex-direction:column}
.pbody{padding:clamp(16px,2.2vw,30px);display:flex;flex-direction:column;gap:16px;min-width:0}
.tag{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 10px}
.tag.dn{background:var(--wrong);color:var(--ink)} .tag.up{background:var(--well)} .tag.nt{background:var(--sky)}
.layer{font-family:var(--ff-serif);font-weight:600;font-size:clamp(20px,1rem + .6vw,26px);line-height:1.1;color:var(--mute)}
.layer small{font-family:var(--ff-sans);font-weight:700;font-size:15px;color:var(--well-ink);margin-left:10px}
.mind{font-size:clamp(17px,.95rem + .3vw,20px);max-width:64ch;line-height:1.9}
.mind .kw{border:0;background:var(--soft);box-shadow:inset 0 -2px 0 var(--ink);padding:1px 6px;font-weight:700}
.mind .kw[aria-pressed="true"]{background:var(--ink);color:var(--ice);box-shadow:none}
.q{display:flex;flex-direction:column;gap:12px}
.q.core p{font-size:min(clamp(22px,1rem + 1.2vw,34px),3.7vh)}
.q p{font-family:var(--ff-serif);font-size:min(clamp(24px,1.05rem + 1.5vw,40px),4.6vh);line-height:1.14;letter-spacing:-.005em;max-width:30ch;text-wrap:balance}
.lead{font-size:clamp(17px,.95rem + .3vw,20px);max-width:60ch}
.lead b{font-weight:700}
.script{background:var(--sky);padding:clamp(16px,2vw,26px);font-family:var(--ff-serif);font-size:clamp(22px,1rem + 1.1vw,32px);line-height:1.25;max-width:40ch}
.risks{display:flex;flex-direction:column;gap:8px}
.risks li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;border-top:1.5px solid var(--line);padding-top:10px}
.risks b{font-family:var(--ff-serif);font-weight:600;font-size:20px;line-height:1.15}
.risks span{grid-column:2;color:var(--mute);font-size:16px;max-width:62ch}
.risks i{display:block;width:12px;height:12px;background:var(--wrong);transform:translateY(1px)}

/* compose + notes */
.compose{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.compose textarea{border:2px solid var(--ink);background:var(--paper);padding:12px 14px;font-size:18px;line-height:1.35;resize:vertical;min-height:56px;min-width:0}
.compose button{border:0;background:var(--ink);color:var(--ice);font-weight:700;padding:0 20px;font-size:16px}
.kinds{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kinds>span{font-size:15px;color:var(--mute);margin-right:4px}
.kinds button{border:1.5px solid var(--ink);background:var(--paper);padding:6px 12px;font-size:15px;font-weight:700}
.kinds button[aria-pressed="true"]{background:var(--ink);color:var(--ice)}
.hint{font-size:14px;color:var(--mute)}
.cmp{display:flex;flex-direction:column;gap:10px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.note{position:relative;padding:12px 34px 14px 14px;min-height:92px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 0 rgba(0,0,0,.18);min-width:0}
.note.dn{background:var(--wrong)} .note.up{background:var(--well)}
.note .tx{font-size:18px;line-height:1.3;outline:none;overflow-wrap:anywhere;white-space:pre-wrap}
.note .tx:focus{box-shadow:0 0 0 2px var(--ink)}
.note .k{font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.note .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;background:transparent;font-size:20px;line-height:1;display:grid;place-items:center}
.note .x:hover{background:rgba(0,0,0,.12)}
.note.ex::after{content:"Example";position:absolute;bottom:6px;right:8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.empty{padding:16px;border:2px dashed var(--line);color:var(--mute);font-size:16px}

/* on the way down, shown while climbing */
.echo{background:var(--soft);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.echo ul{display:flex;flex-wrap:wrap;gap:6px}
.echo li{background:var(--wrong);padding:4px 10px;font-size:14px;opacity:.85;max-width:100%;overflow-wrap:anywhere}

/* expert drawer */
.xp{border-top:1.5px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.xpbtn{align-self:flex-start;border:0;background:var(--sky);font-weight:700;padding:10px 14px;font-size:15px;display:flex;gap:8px;align-items:center}
.xpbtn[aria-expanded="true"]{background:var(--sea);color:var(--ice)}
.xcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.xc{background:var(--soft);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.xc .who{font-size:13px;font-weight:700;color:var(--mute)}
.xc .nm{font-family:var(--ff-serif);font-weight:600;font-size:19px;line-height:1.15}
.xc .lv{font-size:18px;line-height:1.4}
.xc .lv em{font-style:normal;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;color:var(--mute);margin-top:4px}
.xc details{font-size:15px;color:var(--mute)}
.xc summary{cursor:pointer;font-weight:700;color:var(--ink)}
.xc details p{margin-top:6px}
.xnote{font-size:14px;color:var(--mute)}

/* set up */
.clusters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cl{background:var(--soft);display:flex;flex-direction:column;min-width:0}
.cl h3{font-family:var(--ff-serif);font-weight:600;font-size:21px;line-height:1.1;padding:12px 14px 6px}
.cl label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 14px;cursor:pointer;font-size:16px;line-height:1.3}
.cl label:last-child{padding-bottom:14px}
.cl label:hover{background:rgba(88,120,160,.12)}
.cl input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ink)}
.cl label small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.cl.on{background:var(--sky)}
.cl.off{opacity:.55}

/* whole iceberg */
.whole{display:flex;flex-direction:column;gap:0}
.wrow{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);min-width:0}
.wrow>div{padding:12px;min-width:0}
.wrow .wl{font-family:var(--ff-serif);font-weight:600;font-size:19px;line-height:1.1}
.wrow.h>div{padding-block:8px}
.wrow.h .eyebrow{display:flex;gap:8px;align-items:center}
.wrow.h i{display:inline-block;width:12px;height:12px}
.wrow.s{background:var(--sky)} .wrow.u{background:var(--sea);color:var(--ice)} .wrow.c{background:var(--deep);color:var(--ice)}
.wrow .notes{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wrow .note{min-height:0;padding:9px 30px 10px 10px;color:var(--ink)}
.wrow .note .tx{font-size:15px}
.wrow .empty{border-color:currentColor;color:inherit;opacity:.85;font-size:14px;padding:10px}
@media(max-width:700px){.wrow{grid-template-columns:minmax(0,1fr)}.wrow.h{display:none}.wrow>div:nth-child(2)::before{content:"2060 gone wrong";display:block;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}.wrow>div:nth-child(3)::before{content:"2060 gone well";display:block;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;font-weight:700;padding:12px 18px;font-size:16px}
.btn.k{background:var(--ink);color:var(--ice)} .btn.l{background:var(--sky)} .btn.w{background:var(--wrong)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--soft);padding:10px 14px}
.out{width:100%;min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:13px;border:2px solid var(--ink);padding:10px}
.toast{font-weight:700;font-size:15px}

/* panel foot */
.pfoot{display:flex;justify-content:space-between;gap:10px;padding:10px clamp(18px,2.6vw,36px);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--line);margin-top:auto;position:sticky;bottom:0;background:var(--paper);z-index:5}
.pfoot button{border:0;font-weight:700;padding:12px 18px;font-size:17px;display:flex;align-items:center;gap:10px}
.pfoot .back{background:var(--soft)}
.pfoot .next{background:var(--ink);color:var(--ice)}
.pfoot .next.up{background:var(--bar)}
.pfoot button:disabled{opacity:.35;cursor:default}
.keys{font-size:13px;color:var(--mute);align-self:center;text-align:center}
@media(max-width:560px){.keys{display:none}}
/* editing the page's own words */
.wrow>div[data-h]::before{content:attr(data-h)!important}
html.editmode [data-copy]{outline:2px dashed #E08850;outline-offset:2px;cursor:text}
html.editmode [data-copy]:hover{outline-style:solid;background-color:rgba(224,136,80,.16)}
html.editmode text[data-copy]{outline:none;text-decoration:underline dashed #E08850}
#ed{position:fixed;z-index:60;background:var(--paper);border:2px solid var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px;display:flex;flex-direction:column;gap:8px}
#ed[hidden]{display:none!important}
#ed textarea{border:2px solid var(--ink);padding:10px 12px;font-size:17px;line-height:1.4;resize:vertical;width:100%}
.edacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.edacts .btn{padding:9px 14px;font-size:15px}
#edbar{position:fixed;z-index:50;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column-reverse;gap:6px;align-items:flex-start;max-width:min(380px,calc(100vw - 32px))}
#edbar[hidden]{display:none!important}
#edtoggle{border:2px solid var(--ink);background:var(--paper);font-weight:700;padding:9px 14px;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
#edtoggle[aria-pressed="true"]{background:#E08850}
#edtip,#edstatus{background:var(--ink);color:var(--ice);font-size:14px;padding:8px 12px}
#edtip[hidden],#edstatus[hidden]{display:none!important}
.xc .blank{font-style:italic;opacity:.75}
/* ================= October edits: the ocean stage, cluster map, living iceberg, deeper layers ================= */
.work{position:relative;--gap:clamp(14px,2vw,28px);gap:var(--gap)}
.panel{position:relative;z-index:1}
.berg{z-index:1}
@media(max-width:900px){.berg{position:relative;top:0}}
.keys{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* the ocean behind set up and imagine */
.ocean{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:0;background-color:var(--obg,#5878A0);transition:opacity .7s var(--ease),background-color .9s var(--ease)}
.ocean .full,.ocean .sea{position:absolute;left:0;right:0;bottom:0;opacity:0;transition:opacity .9s var(--ease),top .9s var(--ease)}
.ocean .full{top:0;background:linear-gradient(180deg,#5878A0 0%,#33507A 34%,#1C3150 100%)}
.ocean .sea{top:var(--wl,45%);background:linear-gradient(180deg,#5878A0 0%,#2C4770 45%,#1C3150 100%)}
.work[data-v=map] .ocean .full{opacity:1}
.work[data-v=imagine] .ocean .sea{opacity:1}
.work[data-v=imagine]{--obg:var(--sky)}
.work[data-bg]{--obg:var(--sky)}
.work[data-bg=under]{--obg:#5878A0}
.work[data-bg=core]{--obg:#1C3150}
.work[data-bg] .ocean{opacity:1}
.work[data-v],.work[data-bg]{overflow:clip}
.ocean .glow{position:absolute;left:-20%;right:-20%;top:-35%;height:80%;background:radial-gradient(ellipse at 28% 0%,rgba(192,232,248,.26),transparent 62%);animation:glow 14s ease-in-out infinite alternate}
@keyframes glow{to{transform:translateX(6%)}}
.work[data-v] .ocean{opacity:1}
.ocean .glow{opacity:.8}
.work[data-v]{min-height:clamp(620px,calc(100vh - 140px),960px);align-items:stretch}
.work[data-v] .panel{background:transparent;color:var(--ice)}
.panel{transition:background-color .6s var(--ease),color .6s var(--ease)}
.work[data-bg] .panel{background:transparent}
.work[data-bg] .pfoot,.work[data-v] .pfoot{position:static;background:rgba(28,49,80,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top-color:rgba(255,255,255,.2)}
.work[data-bg] .pfoot .back,.work[data-v] .pfoot .back{background:rgba(255,255,255,.14);color:var(--ice)}
.work[data-bg] .pfoot .next,.work[data-v] .pfoot .next{background:var(--ice);color:var(--ink)}
.work[data-v=imagine] .pfoot .next{background:var(--sky)}
.pfoot .next.rise i{display:inline-grid}.pfoot .next i{display:none;width:22px;height:22px}.pfoot .next i svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;animation:nudgeup 1.8s ease-in-out infinite}
.work[data-v] .hint{color:rgba(255,255,255,.8)}
.work[data-v] .eyebrow{color:inherit}
.work[data-v] .tag{color:var(--ink)}
@media(min-width:901px){.work[data-v=map] .panel{grid-column:2}}

/* the iceberg: out of sight while choosing, rising in for imagine */
.berg{transition:opacity .8s var(--ease),transform 1s var(--ease)}
.work[data-v=map] .berg{position:absolute;left:0;top:0;width:calc((100% - var(--gap)) * .78 / 2.28);opacity:0;transform:translateY(110px) scale(.94);pointer-events:none;transition:opacity .35s var(--ease),transform .5s var(--ease)}
@media(max-width:900px){.work[data-v=map] .berg{width:100%}}
.work[data-v=imagine] .berg{transition:opacity 1s .32s var(--ease),transform 1.3s .32s var(--ease)}
.work[data-v] .berg,.work[data-v] .berg .bgd{background:transparent}
.berg .bgd{background:linear-gradient(180deg,var(--sky) 0 22.1%,var(--deep) 22.1%);transition:background .7s var(--ease)}
.work[data-v=imagine] .berg .bgd{overflow:visible}
.work[data-v=imagine] .berg .dl,.work[data-v=imagine] .berg .cnt{opacity:0}
.berg .dl,.berg .cnt{transition:opacity .5s}
@media(max-width:900px){.work[data-v=imagine] .berg{transform:none}.work[data-v=imagine] .berg .bgd{overflow:hidden}}
.berg .sky,.berg .sea{transition:opacity .8s var(--ease)}
.work[data-v] .berg .sky,.work[data-v] .berg .sea{opacity:0}
.berg .lab.sk{transition:fill .6s}
.work[data-v=imagine] .berg{transform:translateY(var(--bty,0px))}
.legend{transition:opacity .5s var(--ease)}
.work[data-v] .legend{display:none}

/* the iceberg, alive: it bobs, the waterline drifts, bubbles rise, and it leans a touch with the pointer */
.berg svg{transform:translate(calc(var(--px,0) * 1px),calc(var(--py,0) * 1px));transition:transform 1.2s var(--ease)}
.berg .floe,.berg .floe2{transform-box:view-box;transform-origin:193px 124px;animation:bob 9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3.5px) rotate(-.6deg)}65%{transform:translateY(2px) rotate(.45deg)}}
.berg .wave{animation:wave 5.5s linear infinite}
@keyframes wave{to{transform:translateX(-60px)}}
.berg .bub circle{fill:#FFFFFF;opacity:0;transform-box:fill-box;animation:bubble 10s linear infinite}
.berg .bub circle:nth-child(2){animation-duration:12s;animation-delay:-3s}
.berg .bub circle:nth-child(3){animation-duration:9s;animation-delay:-6s}
.berg .bub circle:nth-child(4){animation-duration:13s;animation-delay:-1.5s}
.berg .bub circle:nth-child(5){animation-duration:11s;animation-delay:-8s}
.berg .bub circle:nth-child(6){animation-duration:10.5s;animation-delay:-4.5s}
@keyframes bubble{0%{opacity:0;transform:translate(0,0)}12%{opacity:.5}50%{transform:translate(5px,-170px)}88%{opacity:.25}100%{opacity:0;transform:translate(-3px,-340px)}}

/* set up: the words on the left, the map beside them */
.stintro{position:absolute;z-index:2;left:0;top:0;width:calc((100% - var(--gap)) * .78 / 2.28);padding:clamp(20px,2.6vw,38px);color:var(--ice);
  display:flex;flex-direction:column;gap:16px;opacity:0;visibility:hidden;transform:translateY(14px);
  transition:opacity .35s var(--ease),transform .45s var(--ease),visibility 0s .45s}
.work[data-v=map] .stintro{opacity:1;visibility:visible;transform:none;transition:opacity .8s .15s var(--ease),transform .9s .15s var(--ease)}
@media(max-width:900px){.stintro{width:100%}}
.stq{font-family:var(--ff-serif);font-weight:400;font-size:clamp(30px,1rem + 1.9vw,50px);line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.stq b{font-family:var(--ff-sans);font-weight:700;letter-spacing:-.025em}
.stlead{font-size:clamp(16px,.9rem + .25vw,19px);line-height:1.5;color:rgba(255,255,255,.88);max-width:34ch}
.sthow{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:15px;line-height:1.4;max-width:32ch}
.sthow::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--pick);box-shadow:0 0 0 4px rgba(224,192,96,.3);transform:translateY(1px);animation:beat 2.4s ease-in-out infinite}
@keyframes beat{50%{box-shadow:0 0 0 8px rgba(224,192,96,0)}}

/* the map itself */
.cmap{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility 0s .5s}
.work[data-v] .cmap{opacity:1;visibility:visible;transition:opacity .6s var(--ease)}
.cmap .nodes{position:absolute;inset:0}
.cmap .teth{position:absolute;left:0;top:0;overflow:visible}
.cmap .teth path{fill:none;stroke:var(--c);stroke-width:1.6;stroke-linecap:round;transition:stroke-width .4s var(--ease)}
.cmap .teth path.mine{stroke-dasharray:2 7;stroke-width:1.8}
.cmap .teth path.on{stroke-dasharray:none;stroke-width:2.6}
.cmap .hub,.cmap .sat{position:absolute;left:0;top:0;border:0;padding:0;margin:0;border-radius:50%;background:var(--c);color:var(--ink);will-change:transform,width,height;pointer-events:auto}
.cmap .hub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--hf,16px) * .36);text-align:center;transition:box-shadow .45s var(--ease),background-color .45s var(--ease),color .45s var(--ease)}
.cmap .hub .hn{font-family:var(--ff-serif);font-weight:400;font-size:var(--hf,16px);line-height:1.08;max-width:74%;text-wrap:balance}
.cmap .hub .hk{font-weight:700;font-size:max(9px,calc(var(--hf,16px) * .46));letter-spacing:.13em;text-transform:uppercase}
.cmap[data-mode=map] .hub{cursor:pointer}
.cmap[data-mode=map] .hub.hot,.cmap .hub.sel{box-shadow:0 0 0 calc(var(--hf,16px) * .45) color-mix(in srgb,var(--c) 24%,transparent),0 0 80px color-mix(in srgb,var(--c) 38%,transparent)}
.cmap[data-hot] .hub:not(.hot){background:color-mix(in srgb,var(--c) 18%,#263F60);color:color-mix(in srgb,var(--c) 55%,#263F60)}
.cmap[data-mode=imagine] .hub{cursor:default}
.cmap .hub:focus-visible,.cmap .sat:focus-visible{outline:3px solid var(--ice);outline-offset:5px}
.cmap .sat{display:grid;place-items:center;z-index:2;transition:background-color .4s var(--ease),box-shadow .4s var(--ease)}
.cmap .sat::before{content:"";position:absolute;inset:-9px;border-radius:50%}
.cmap[data-hot] .sat:not(.hot){background:color-mix(in srgb,var(--c) 18%,#263F60)}
.cmap .sat .tick{width:54%;height:54%;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .5s var(--ease)}
.cmap[data-mode=imagine] .sat.mine{cursor:pointer;background:color-mix(in srgb,var(--c) 12%,#22395A);box-shadow:inset 0 0 0 2.5px var(--c)}
.cmap[data-mode=imagine] .sat.mine:hover{background:color-mix(in srgb,var(--c) 32%,#22395A)}
.cmap[data-mode=imagine] .sat.on{background:var(--c);box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 24%,transparent),0 0 40px color-mix(in srgb,var(--c) 40%,transparent)}
.cmap[data-mode=imagine] .sat.on:hover{background:var(--c)}
.cmap .sat.on .tick{stroke-dashoffset:0}
.cmap[data-pulse] .sat.mine::after{content:"";position:absolute;inset:-2px;border-radius:50%;box-shadow:0 0 0 0 var(--c);animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 70%,transparent)}100%{box-shadow:0 0 0 18px color-mix(in srgb,var(--c) 0%,transparent)}}
.cmap .slab{position:absolute;left:0;top:0;width:210px;color:var(--ice);pointer-events:none;display:flex;flex-direction:column;gap:5px;
  opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}
.cmap .slab .lt{font-family:var(--ff-serif);font-size:17px;line-height:1.15;text-wrap:balance}
.cmap .slab .ld,.cmap .slab .lx{display:none}
.cmap .slab.hot{opacity:1;visibility:visible;transition:opacity .35s var(--ease)}
.cmap[data-mode=imagine] .slab.mine{opacity:.62;visibility:visible;pointer-events:auto;cursor:pointer;transition:opacity .45s .2s var(--ease)}
.cmap[data-mode=imagine] .slab.mine:hover{opacity:.85}
.cmap[data-mode=imagine] .slab.on{opacity:1}
.cmap[data-mode=imagine] .slab .lt{font-size:clamp(19px,1rem + .45vw,24px)}
.cmap[data-mode=imagine] .slab .ld{display:block;font-size:15.5px;line-height:1.45;color:rgba(255,255,255,.84);max-width:52ch}
.cmap[data-mode=imagine] .slab .lx{display:block;font-size:13px;color:rgba(255,255,255,.6)}

/* imagine: the script, then the cluster */
.work[data-v=imagine] .script{background:transparent;padding:2px 0 2px clamp(16px,1.6vw,24px);border-left:4px solid var(--wrong);
  font-family:var(--ff-sans);font-weight:400;font-size:clamp(20px,1rem + .8vw,29px);line-height:1.42;letter-spacing:-.005em;max-width:44ch;color:var(--ice)}
.work[data-v=imagine] .script b{font-weight:700}
.pickhd{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.spot{position:relative;width:100%;min-height:220px;transition:height .5s var(--ease)}
.chg{align-self:flex-start;border:0;background:none;padding:4px 0;font-weight:700;font-size:15px;color:inherit;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;opacity:.85}
.chg:hover{opacity:1}

/* step changes: content settles in; between layers it falls away upwards as the next rises from below */
.pbody.enter>*{animation:rise .55s var(--ease) both}
.pbody.enter>*:nth-child(2){animation-delay:.05s}.pbody.enter>*:nth-child(3){animation-delay:.1s}
.pbody.enter>*:nth-child(4){animation-delay:.15s}.pbody.enter>*:nth-child(5){animation-delay:.2s}.pbody.enter>*:nth-child(n+6){animation-delay:.25s}
.work[data-v=imagine] .pbody.enter>*{animation-duration:.8s}
.work[data-v=imagine] .pbody.enter>*:nth-child(1){animation-delay:.42s}
.work[data-v=imagine] .pbody.enter>*:nth-child(2){animation-delay:.52s}
.work[data-v=imagine] .pbody.enter>*:nth-child(3){animation-delay:.72s}
.work[data-v=imagine] .pbody.enter>*:nth-child(n+4){animation-delay:.8s}
.pbody.enter>.spot{animation-name:fadein}
@keyframes fromBelow{from{opacity:0;transform:translateY(90px)}to{opacity:1;transform:none}}
@keyframes fromAbove{from{opacity:0;transform:translateY(-90px)}to{opacity:1;transform:none}}
@keyframes toAbove{to{opacity:0;transform:translateY(-110px)}}
@keyframes toBelow{to{opacity:0;transform:translateY(110px)}}
.pbody.enter[data-way=dn]>*{animation:fromBelow .75s var(--ease) both}
.pbody.enter[data-way=up]>*{animation:fromAbove .75s var(--ease) both}
.pbody.enter[data-way]>*:nth-child(1){animation-delay:.2s}.pbody.enter[data-way]>*:nth-child(2){animation-delay:.27s}
.pbody.enter[data-way]>*:nth-child(3){animation-delay:.34s}.pbody.enter[data-way]>*:nth-child(n+4){animation-delay:.4s}
.panel{overflow:clip}
.ghost{position:absolute;z-index:2;pointer-events:none;background:var(--paper)}
.ghost.dn{animation:toAbove .42s var(--ease) forwards}
.ghost.up{animation:toBelow .42s var(--ease) forwards}
.ghost>*{animation:none!important}

/* the layers: a big centred heading, the questions smaller, side by side */
.work[data-layer] .pbody{padding-top:clamp(26px,3.4vw,52px);gap:20px}
.lhead{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.work[data-layer] .layer{font-family:var(--ff-serif);font-weight:400;font-size:clamp(44px,1.4rem + 3.4vw,84px);line-height:.98;letter-spacing:-.02em;color:var(--ink)}
.upnote{font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;background:var(--well);padding:5px 10px}
.q.cols{display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));gap:clamp(14px,2vw,30px);margin-top:4px;padding-bottom:6px}
.q.cols p{font-size:clamp(19px,.95rem + .65vw,26px);line-height:1.22;max-width:none;text-align:center;text-wrap:balance}
.q.cols.core p,.work[data-layer] .q.cols p{font-size:clamp(19px,.95rem + .6vw,25px)}
@media(max-width:700px){.q.cols{grid-template-columns:minmax(0,1fr)}}
.work[data-layer] .mind{text-align:center;margin-inline:auto}
.work[data-layer] .pfoot{display:none}
.work[data-layer] .pbody{padding-right:clamp(70px,7vw,112px)}

/* expert futures: one round button, then each future broken into steps */
.xp{border-top:1.5px solid var(--line);padding-top:22px;align-items:center;gap:16px}
.xpbtn{background:none!important;color:var(--ink)!important;border:0;padding:4px;flex-direction:column;align-self:center;gap:10px;font-weight:700;font-size:15px}
.xpbtn:active:not(:disabled){transform:none}
.xpbtn .orb{--near:0;position:relative;width:64px;height:64px;border-radius:50%;background:var(--sea);display:grid;place-items:center;
  box-shadow:0 0 0 calc(var(--near) * 10px) rgba(88,120,160,.18),0 6px 18px rgba(28,49,80,.25);transition:transform .35s var(--ease),background-color .3s,box-shadow .35s var(--ease)}
.xpbtn .orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(88,120,160,.45);animation:halo 2.8s ease-out infinite}
@keyframes halo{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.xpbtn .orb svg{width:30px;height:30px;fill:none;stroke:var(--ice);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;animation:nudge 1.8s ease-in-out infinite;transition:transform .4s var(--ease)}
@keyframes nudge{50%{translate:0 4px}}
.xpbtn:hover .orb{background:var(--deep)}
.xp.open .orb{background:var(--deep)}
.xp.open .orb::after{animation:none;opacity:0}
.xp.open .orb svg{transform:rotate(180deg);animation:none}
.xpbtn .xlbl{border-bottom:1.5px solid currentColor;padding-bottom:1px}
.xcards{width:100%;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.xc{padding:16px 18px 18px;gap:10px}
.xc .xh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.xc .who{font-size:14px;font-weight:700;color:var(--ink)}
.xc .xr,.xc .xf{font-size:13px;color:var(--mute)}
.xc .xf::before{content:"· "}
.xc .nm{font-size:20px}
.xc .xk{font-style:normal;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.xsteps{counter-reset:s;display:flex;flex-direction:column;gap:0;list-style:none}
.xsteps li{counter-increment:s;position:relative;padding:0 0 12px 34px;font-size:17px;line-height:1.4}
.xsteps li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--wrong);font-weight:700;font-size:12px;display:grid;place-items:center}
.xsteps li:not(:last-child)::after{content:"";position:absolute;left:10.25px;top:26px;bottom:2px;width:1.5px;background:var(--line)}
.xsteps li:last-child{padding-bottom:0}
.work .pbody .xc .xsteps.whole li{font-size:15.5px}
.xc details[open] summary{margin-bottom:10px}

/* the rail: up and down the iceberg, on the right edge of the panel */
.rail{position:fixed;z-index:30;top:50%;right:max(26px,calc((100vw - var(--max)) / 2 + 30px));transform:translateY(-40%);display:flex;flex-direction:column;align-items:center;gap:12px}
.rail[hidden]{display:none!important}
.rbtn{position:relative;border:0;width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--ice);display:grid;place-items:center;padding:0;
  box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .3s var(--ease),background-color .3s,opacity .3s}
.rbtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rbtn span{position:absolute;right:calc(100% + 12px);top:50%;transform:translate(6px,-50%);white-space:nowrap;background:var(--ink);color:var(--ice);font-weight:700;font-size:14px;padding:7px 12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--ease)}
.rbtn:hover span,.rbtn:focus-visible span{opacity:1;transform:translate(0,-50%)}
.rbtn:hover:not(:disabled){transform:scale(1.06)}
#rdn{background:var(--wrong);color:var(--ink)}
.rail[data-dir=up] #rup{background:var(--well);color:var(--ink)}
.rail[data-dir=up] #rdn{background:var(--ink);color:var(--ice)}
#rdn:not(:disabled) svg{animation:nudge 1.8s ease-in-out infinite}
.rail[data-dir=up] #rdn svg{animation:none}
.rail[data-dir=up] #rup:not(:disabled) svg{animation:nudgeup 1.8s ease-in-out infinite}
@keyframes nudgeup{50%{translate:0 -4px}}
.rbtn:disabled{opacity:.18;cursor:default}
.rtrack{display:flex;flex-direction:column;align-items:center;gap:0;position:relative;padding:4px 0}
.rtrack::before{content:"";position:absolute;top:10px;bottom:10px;left:50%;width:2px;margin-left:-1px;background:var(--line)}
.rdot{position:relative;border:0;background:none;padding:9px;display:grid;place-items:center}
.rdot i{display:block;width:12px;height:12px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--ink);transition:transform .4s var(--ease),background-color .3s}
.rdot.cur i{background:var(--ink);transform:scale(1.35)}
.rail[data-dir=dn] .rdot.cur i{background:var(--wrong)}
.rail[data-dir=up] .rdot.cur i{background:var(--well)}
.rdot span{position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--ink);background:var(--paper);padding:5px 9px;box-shadow:0 2px 10px rgba(0,0,0,.12);pointer-events:none;opacity:0;transition:opacity .25s}
.rdot:hover span,.rdot:focus-visible span{opacity:1}
@media(max-width:900px){
  .rail{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:12px;transform:none;gap:8px}
  .rbtn{width:46px;height:46px}
  .rdot span{display:none}
  .work[data-layer] .pbody{padding-right:clamp(16px,2.2vw,30px);padding-bottom:120px}
}

@media(prefers-reduced-motion:reduce){
  .berg .floe,.berg .floe2,.berg .wave,.berg .bub circle,.ocean .glow,.sthow::before,.cmap[data-pulse] .sat.mine::after,.xpbtn .orb::after,.xpbtn .orb svg,.rbtn svg{animation:none!important}
  .pbody.enter>*,.ghost{animation:none!important}
  .berg,.stintro,.cmap,.panel{transition:none!important}
}
@media(max-width:900px){
  .work[data-v=imagine] .berg svg{max-height:34vh}
  .rtrack{display:none}
}

/* ================= the iceberg in its cluster's colours, with its words inside ================= */
.berg .tip{fill:#E8F7FC}
.berg .body{fill:var(--ice-c,#DDF2FA);fill-opacity:.72;stroke:#FFFFFF;stroke-opacity:.7;transition:fill .9s var(--ease),fill-opacity .9s var(--ease)}
.berg[data-c] .body{fill-opacity:.94;stroke:#0A0A0A;stroke-opacity:.85}
.berg .bt{opacity:0;transition:opacity .6s var(--ease)}
.work[data-v=imagine] .berg .bt{opacity:1;transition:opacity .8s 1s var(--ease)}
.btx{font-family:var(--ff-sans);color:#0A0A0A;display:flex;flex-direction:column;gap:12px;height:100%;padding:6px 8px;text-align:center;align-items:center}
.btx b{font-weight:700;font-size:21px;line-height:1.08;letter-spacing:-.01em;text-wrap:balance;margin-top:14px}
.btx ul{display:flex;flex-direction:column;gap:9px;list-style:none;margin:0;padding:0}
.btx li{font-size:14px;line-height:1.25;text-wrap:balance;padding-top:9px;border-top:1.5px solid rgba(10,10,10,.35)}
.btx p{font-size:13px;opacity:.7;margin:0}

/* imagine: cluster in the sky (dark words), script in the sea (white words) */
.work[data-v=imagine] .panel{color:var(--ink)}
.work[data-v=imagine] .hint{color:var(--mute)}
.work[data-v=imagine] .chg{color:var(--ink)}
.work[data-v=imagine] .pbody{gap:14px}
.work[data-v=imagine] .tag.dn{margin-top:46px}
.cmap[data-mode=imagine] .slab{color:var(--ink)}
.cmap[data-mode=imagine] .slab .ld{color:var(--mute)}
.cmap[data-mode=imagine] .slab .lx{color:rgba(10,10,10,.55)}
.cmap[data-mode=imagine] .slab.mine{opacity:.72}
.cmap[data-mode=imagine] .sat.mine{background:color-mix(in srgb,var(--c) 22%,#FFFFFF);box-shadow:inset 0 0 0 2.5px color-mix(in srgb,var(--c) 70%,#0A0A0A)}
.cmap[data-mode=imagine] .sat.mine:hover{background:color-mix(in srgb,var(--c) 45%,#FFFFFF)}
.cmap[data-mode=imagine] .sat.on{background:var(--c);box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 30%,transparent)}
.cmap[data-mode=imagine] .teth path{stroke:color-mix(in srgb,var(--c) 70%,#0A0A0A)}
.cmap[data-mode=imagine] .hub.sel{box-shadow:0 0 0 calc(var(--hf,16px) * .45) color-mix(in srgb,var(--c) 30%,transparent)}

/* ================= the layers: no box, the scene changes colour as we go down ================= */
.work[data-bg] .panel{color:var(--ink)}
.work[data-bg=under] .panel,.work[data-bg=core] .panel{color:var(--ice)}
.work[data-layer] .layer{font-family:var(--ff-sans);font-weight:700;letter-spacing:-.03em;color:inherit}
.work[data-layer] .q.cols p{font-family:var(--ff-sans);font-weight:400;letter-spacing:-.005em;line-height:1.3}
.work[data-bg] .hint{color:inherit;opacity:.8}
.work[data-bg] .empty{border-color:currentColor;color:inherit;opacity:.7}
.work[data-bg] .xp{border-top-color:color-mix(in srgb,currentColor 28%,transparent)}
.work[data-bg] .xpbtn{color:inherit!important}
.work[data-bg=under] .xpbtn .orb,.work[data-bg=core] .xpbtn .orb{background:var(--ice)}
.work[data-bg=under] .xpbtn .orb svg,.work[data-bg=core] .xpbtn .orb svg{stroke:var(--ink)}
.work[data-bg=under] .xpbtn .orb::after,.work[data-bg=core] .xpbtn .orb::after{border-color:rgba(255,255,255,.55)}
.work[data-bg=surface] .xpbtn .orb{background:var(--sea)}
.work[data-bg] .xc{color:var(--ink)}
.work[data-bg] .xnote{color:inherit;opacity:.75}
.work[data-bg] .echo{background:color-mix(in srgb,currentColor 10%,transparent)}
.work[data-bg] .compose textarea{border-color:transparent}

.work[data-bg] .mind .kw{color:var(--ink)}
.work[data-bg] .q p{color:inherit}
.ghost{background:transparent}

/* the way on, at the foot of each layer */
.gonext{display:flex;justify-content:center;padding:18px 0 6px}
.gobtn{border:0;display:inline-flex;align-items:center;gap:14px;padding:14px 16px 14px 26px;border-radius:999px;font-weight:700;font-size:18px;background:var(--ink);color:var(--ice);box-shadow:0 8px 24px rgba(0,0,0,.18);transition:transform .3s var(--ease),box-shadow .3s}
.gobtn i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--wrong)}
.gobtn.up i{background:var(--well)}
.gobtn svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;animation:nudge 1.8s ease-in-out infinite}
.gobtn.up svg{animation-name:nudgeup}
.gobtn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.24)}


/* rail colours follow the water */
.rail[data-bg=under] .rbtn:not(#rdn),.rail[data-bg=core] .rbtn:not(#rdn){background:var(--ice);color:var(--ink)}
.rail[data-bg=under] .rtrack::before,.rail[data-bg=core] .rtrack::before{background:rgba(255,255,255,.45)}
.rail[data-bg=under] .rdot i,.rail[data-bg=core] .rdot i{box-shadow:inset 0 0 0 2px var(--ice);background:transparent}
.rail[data-bg=under] .rdot.cur i,.rail[data-bg=core] .rdot.cur i{box-shadow:none}
.rail[data-dir=up][data-bg=under] #rdn,.rail[data-dir=up][data-bg=core] #rdn{background:var(--ice);color:var(--ink)}
@media(prefers-reduced-motion:reduce){.gobtn svg,.pfoot .next i svg{animation:none!important}}

/* October 17: buttons in dark blue, mustard labels, the peek button, a grey edge on the pale cluster */
.compose button,.gobtn{background:#1C3150;color:var(--ice)}
.work[data-bg=core] .compose button,.work[data-bg=core] .gobtn{background:#5878A0;color:var(--ice)}
.mind .kw[aria-pressed="true"]{background:var(--pick);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.xpbtn{flex-direction:row;align-items:center;gap:14px;font-size:17px}
.xpbtn .orb{width:52px;height:52px}
.xpbtn .orb svg{width:26px;height:26px}
.xpbtn .xlbl{border-bottom:0;padding:0;text-align:left}
.xpbtn:hover .xlbl{text-decoration:underline;text-underline-offset:4px}
.cmap .hub[data-c=data],.cmap .sat[data-c=data]{border:1.5px solid #8094A6}
.pickq{font-family:var(--ff-sans);font-weight:400;font-size:clamp(24px,1rem + 1vw,34px);line-height:1.1;letter-spacing:-.015em;color:var(--ink)}
.pickq b{font-weight:700}
.cmap{transition:opacity .9s var(--ease),visibility 0s .5s}
.cmap .teth path{opacity:0}
/* October 17b: one risk, carried inside the iceberg; the imagine line above each layer */
.berg[data-c] .bt{opacity:1}
.work[data-v=map] .berg .bt{opacity:0}
.berg .dim{pointer-events:none}
.btx{gap:6px;justify-content:center;padding:4px 10px}
.btx b{font-family:var(--ff-serif);font-weight:600;font-size:19px;line-height:1.05;letter-spacing:0;margin:0}
.btx .brisk{font-family:var(--ff-serif);font-weight:400;font-size:16px;line-height:1.15;color:#0A0A0A;background:rgba(255,255,255,.55);border:0;padding:6px 10px;text-wrap:balance;cursor:pointer;
  text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:3px;transition:background-color .25s}
.btx .brisk:hover,.btx .brisk[aria-expanded="true"]{background:rgba(255,255,255,.9)}
.btx .brisk:active{transform:none}
.bpop{position:absolute;z-index:6;left:12px;right:12px;top:calc(var(--bty,0px) + 24%);background:var(--paper);color:var(--ink);padding:16px 44px 18px 18px;
  box-shadow:0 14px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:8px;animation:rise .35s var(--ease) both}
.bpop[hidden]{display:none!important}
.bpop .eyebrow{color:var(--mute)}
.bpop h3{font-family:var(--ff-serif);font-weight:600;font-size:23px;line-height:1.12}
.bpop p{font-size:17px;line-height:1.45}
.bpop small{font-size:13px;color:var(--mute)}
.bpop .bx{position:absolute;top:6px;right:6px;width:34px;height:34px;border:0;background:transparent;font-size:24px;line-height:1}
.bpop .bx:hover{background:var(--soft)}
.work[data-v=imagine] .bpop{top:calc(var(--bty,0px) + 26%)}
.imline{font-family:var(--ff-sans);font-size:clamp(15px,.85rem + .25vw,18px);line-height:1.4;max-width:46ch;text-align:center;opacity:.85;margin-bottom:6px;padding:6px 14px;border-left:3px solid var(--wrong)}
.imline.up{border-left-color:var(--well)}
.wlmark{height:1px}
/* October 17c: review fixes */
.wrow>div:nth-child(2)::before{content:"2030 gone wrong"}
.wrow>div:nth-child(3)::before{content:"2030 gone well"}
/* examples are opt-in, from set up */
.stex{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:6px}
.exbtn{border:1.5px solid rgba(255,255,255,.7);background:transparent;color:var(--ice);font-weight:700;font-size:15px;padding:9px 14px;transition:background-color .25s}
.exbtn:hover{background:rgba(255,255,255,.14)}
.exhint{font-size:14px;color:rgba(255,255,255,.75)}
/* no Surface until a risk is on */
.pfoot[data-need]{position:relative}
.pfoot[data-need]::before{content:attr(data-need);position:absolute;right:clamp(18px,2.6vw,36px);bottom:calc(100% + 8px);background:var(--ink);color:var(--ice);font-weight:700;font-size:14px;padding:7px 12px}
/* Imagine fits the screen */
.cmap[data-mode=imagine] .slab .ld{display:none}
.cmap[data-mode=imagine] .slab.on .ld{display:block}
.bpop{top:40%}
/* presenting: one switch at the end of the step bar */
.sbar{display:flex;align-items:stretch;background:var(--bar)}
.sbar ol{flex:1;min-width:0}
.presbtn{flex:none;border:0;background:rgba(0,0,0,.18);color:var(--ice);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;padding:0 14px;white-space:nowrap}
.presbtn i{width:30px;height:18px;border-radius:999px;background:rgba(255,255,255,.35);position:relative;transition:background-color .25s}
.presbtn i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ice);transition:transform .25s var(--ease)}
.presbtn[aria-pressed="true"]{background:var(--pick);color:var(--ink)}
.presbtn[aria-pressed="true"] i{background:var(--ink)}
.presbtn[aria-pressed="true"] i::after{transform:translateX(12px)}
html.present .berg .floe,html.present .berg .floe2,html.present .berg .wave,html.present .berg .bub circle,html.present .ocean .glow,html.present .sthow::before,
html.present .cmap[data-pulse] .sat.mine::after,html.present .xpbtn .orb::after,html.present .xpbtn .orb svg,html.present .rbtn svg,html.present .gobtn svg,html.present .pfoot .next i svg{animation:none!important}
html.present .berg .bub{display:none}
html.present .berg svg{transform:none!important}
html.present .imline{font-size:clamp(20px,1rem + .5vw,24px);opacity:1}
html.present .hint,html.present .xnote,html.present .exhint{font-size:17px}
html.present .cmap .slab .lx,html.present .bpop small{font-size:15px}
html.present .berg .lab{font-size:15px}
html.present .xc .who,html.present .xc .xr,html.present .xc .xf{font-size:15px}
html.present .xsteps li{font-size:19px}
html.present .q.cols p{font-size:clamp(22px,1rem + .8vw,30px)}
/* undo after removing a note */
.undo{position:fixed;z-index:70;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ice);display:flex;align-items:center;gap:16px;padding:10px 12px 10px 18px;font-size:15px;box-shadow:0 10px 28px rgba(0,0,0,.25);animation:rise .3s var(--ease) both}
.undo[hidden]{display:none!important}
.undo button{border:0;background:var(--pick);color:var(--ink);font-weight:700;padding:7px 14px}
@media(max-width:700px){.presbtn span{display:none}}
.stintro .tag{display:none}
/* the room, first thing on set up, as on the Drivers page */
.strm{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.strq{font-family:var(--ff-serif);font-weight:400;font-size:clamp(19px,.95rem + .45vw,24px);line-height:1.1}
.strms{display:flex;flex-wrap:wrap;gap:7px}
.strmb{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:transparent;color:var(--ice);font-weight:700;font-size:15px;padding:0;transition:transform .2s var(--ease),border-color .2s,background-color .2s}
.strmb:hover{border-color:#fff;transform:scale(1.07)}
.strmb:active:not(:disabled){transform:scale(.97)}
.strmb[aria-pressed="true"]{background:var(--well);border-color:var(--well);color:var(--ink)}
.strmb:focus-visible{outline:3px solid #fff;outline-offset:2px}
.stintro{gap:14px}
/* Imagine: Begin, centred under the cluster, instead of a footer button */
.work[data-v=imagine] .pfoot .next{visibility:hidden}
.beginw{flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px}
.gobtn.begin{font-size:20px;padding:14px 16px 14px 30px}
.gobtn.begin:disabled{opacity:.4;cursor:default;box-shadow:none;transform:none}
.gobtn.begin:disabled svg{animation:none}
.beginw .hint{margin:0}
/* ================= SANDBOX: one column, the iceberg behind it, the risk always in view ================= */
/* the layers drop the left column: everything sits in one centred column */
.work[data-layer]{grid-template-columns:minmax(0,1fr)}
.work[data-layer] .panel{grid-column:1;width:100%;max-width:820px;margin:0 auto;z-index:2}
.work[data-layer] .pbody{padding-right:clamp(16px,2.2vw,30px)}

/* the iceberg: large, faint, behind everything, sliding up as the group goes deeper */
.work[data-layer] .berg{position:absolute;left:50%;top:-40px;width:min(1180px,108%);transform:translateX(-50%);z-index:0;pointer-events:none;background:transparent}
.work[data-layer] .berg .bgd{background:transparent!important;overflow:visible}
.work[data-layer] .berg svg{max-height:none;width:100%;translate:0 0;transition:translate 1.2s var(--ease),opacity .8s var(--ease),transform 1.2s var(--ease)}
.work[data-bg=under][data-layer] .berg svg{translate:0 -19%}
.work[data-bg=core][data-layer] .berg svg{translate:0 -52%}
.work[data-layer] .berg .sky,.work[data-layer] .berg .sea,.work[data-layer] .berg .lab,.work[data-layer] .berg #mk,.work[data-layer] .berg .cnt,
.work[data-layer] .berg .bt,.work[data-layer] .berg .dl,.work[data-layer] .berg .dim,.work[data-layer] .berg .floe2,.work[data-layer] .legend,.work[data-layer] .bpop{display:none!important}
.work[data-layer] .berg .floe{opacity:.3}
.work[data-layer] .berg .tip{fill:#FFFFFF;stroke:none}
.work[data-layer] .berg .body{stroke:none!important;fill-opacity:.55}
.work[data-bg=surface][data-layer] .berg .floe{opacity:.45}
.work[data-layer] .berg .wave{opacity:.55}
.work[data-layer] .berg .bub circle{opacity:.6}
@media(max-width:900px){.work[data-layer] .berg{width:150%;top:0}}

/* the risk band: sticky under the step bar, full wording and the scenario, folds to one line */
.rband{position:sticky;top:44px;z-index:12;margin:clamp(12px,1.6vw,20px) clamp(16px,2.2vw,30px) 0;padding:14px 16px 16px;background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);border-left:5px solid var(--c);box-shadow:0 8px 24px rgba(10,10,10,.12);animation:rise .5s var(--ease) both}
.rband[hidden]{display:none!important}
.work[data-bg=under] .rband,.work[data-bg=core] .rband{box-shadow:0 8px 24px rgba(0,0,0,.25)}
.rbtop{display:flex;align-items:center;gap:12px}
.rbdot{flex:none;width:16px;height:16px;border-radius:50%;background:var(--c)}
.rbt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rbt .eyebrow{font-size:11px;opacity:.75}
.rbt h3{font-family:var(--ff-serif);font-weight:600;font-size:clamp(18px,.95rem + .45vw,23px);line-height:1.15}
.rbtg{flex:none;border:0;background:transparent;color:inherit;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;padding:6px 8px}
.rbtg i{width:18px;height:18px;display:grid;place-items:center;transition:transform .35s var(--ease)}
.rbtg svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rband.open .rbtg i{transform:rotate(180deg)}
.rbtg:hover span{text-decoration:underline;text-underline-offset:3px}
.rbbody{display:none;flex-direction:column;gap:8px;margin:10px 0 0 28px}
.rband.open .rbbody{display:flex}
.rbd{font-size:16px;line-height:1.45;max-width:62ch}
.rbs{font-size:16px;line-height:1.45;max-width:62ch;padding-left:12px;border-left:3px solid var(--wrong)}
.rbs.up{border-left-color:var(--well)}
.rbs b{font-weight:700}

/* one thing per row: questions stacked, notes and expert examples in a single column */
.q.stack{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:2px}
.q.stack p{font-family:var(--ff-sans);font-weight:400;font-size:clamp(19px,.95rem + .6vw,25px);line-height:1.3;text-align:center;max-width:34ch;text-wrap:balance}
.work[data-layer] .layer{font-size:clamp(44px,1.4rem + 3vw,78px)}
.work[data-layer] .notes{grid-template-columns:minmax(0,1fr)}
.work[data-layer] .note{min-height:0;padding:14px 40px 14px 16px}
.work[data-layer] .xcards{grid-template-columns:minmax(0,1fr)}
.work[data-layer] .compose textarea{min-height:64px}
.work[data-layer] .echo ul{flex-direction:column}
.work[data-bg=surface][data-layer] .berg svg{translate:0 13%}

/* no Horizon Summit indicator on the risks */
.cmap .slab .lx,.bpop small{display:none!important}
/* the full description, folded under the short one */
.rbfull{align-self:flex-start;border:0;background:transparent;color:inherit;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;padding:2px 0}
.rbfull i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--c);transition:transform .35s var(--ease)}
.rbfull svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rbfull[aria-expanded="true"] i{transform:rotate(180deg)}
.rbfull:hover span{text-decoration:underline;text-underline-offset:3px}
.rbfulltx{display:flex;flex-direction:column;gap:10px;max-width:64ch;max-height:min(46vh,420px);overflow:auto;padding:4px 14px 4px 14px;border-left:3px solid var(--c);animation:rise .35s var(--ease) both}
.rbfulltx p{font-size:16px;line-height:1.5}
.rband{background:rgba(255,255,255,.97)!important;color:var(--ink)!important}
/* the turn arrow */
.turnsvg{overflow:visible}
.turnsvg path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.gobtn .turnsvg path{stroke:var(--ink)}
.turnsvg .arc{stroke-dasharray:1;stroke-dashoffset:.55;transition:stroke-dashoffset .6s var(--ease)}
.turnsvg .head{opacity:0;transition:opacity .25s var(--ease) .3s}
.turnb:hover .turnsvg .arc,.turnb:focus-visible .turnsvg .arc{stroke-dashoffset:0}
.turnb:hover .turnsvg .head,.turnb:focus-visible .turnsvg .head{opacity:1}
.turnb .turnsvg,.turnb svg.turnsvg{animation:none!important}
html.present .turnsvg .arc{stroke-dashoffset:0}html.present .turnsvg .head{opacity:1}
@media(hover:none){.turnsvg .arc{stroke-dashoffset:0}.turnsvg .head{opacity:1}}
/* ================= Rooms: a simple grid of 26 numbers, filling with their cluster colour when chosen ================= */
.strm{gap:12px;margin-bottom:4px}
.strq{font-family:var(--ff-serif);font-size:clamp(24px,1rem + 1vw,34px);line-height:1.1}
.strms{display:grid;grid-template-columns:repeat(3,52px);gap:12px 16px}
.strmb{width:52px;height:52px;border:2px solid #fff;background:transparent;color:#fff;font-size:18px;
  transition:transform .2s var(--ease),background-color .35s var(--ease),border-color .35s var(--ease),color .35s var(--ease),box-shadow .35s var(--ease)}
.strmb:hover{border-color:#fff;background:rgba(255,255,255,.12);transform:scale(1.07)}
.strmb[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--ink);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 30%,transparent)}
.stintro .stq{display:none}
html.present .strmb{font-size:20px}

/* ================= Imagine: still deep in the dark blue, one column, the iceberg faint below ================= */
.work[data-v=imagine]{grid-template-columns:minmax(0,1fr)}
.work[data-v=imagine] .panel{grid-column:1;width:100%;max-width:880px;margin:0 auto;z-index:2;background:transparent}
.work[data-v=imagine] .ocean .sea{opacity:0}
.work[data-v=imagine] .ocean .full{opacity:1}
.work[data-v=imagine] .pbody{color:#fff;align-items:stretch;padding-top:clamp(20px,3vw,44px);padding-bottom:clamp(28px,4vw,56px)}
.work[data-v=imagine] .pfoot{display:none}
.work[data-v=imagine] .pickhd .eyebrow{color:rgba(255,255,255,.78);font-size:13px}
.cmap[data-mode=imagine] .slab{color:#fff}
.cmap[data-mode=imagine] .slab .ld{color:rgba(255,255,255,.84)}
.cmap[data-mode=imagine] .slab.mine{opacity:.9}
.cmap[data-mode=imagine] .slab.dim{opacity:.38;transition:opacity .9s var(--ease)}
.cmap[data-mode=imagine] .sat.mine{background:color-mix(in srgb,var(--c) 14%,#22395A);box-shadow:inset 0 0 0 2.5px var(--c)}
.cmap[data-mode=imagine] .sat.mine:hover{background:color-mix(in srgb,var(--c) 34%,#22395A)}
.cmap[data-mode=imagine] .sat.on{background:var(--c);box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 26%,transparent),0 0 40px color-mix(in srgb,var(--c) 40%,transparent)}
.cmap .sat .tick{transition:stroke-dashoffset .7s .15s var(--ease)}
.cmap[data-mode=imagine] .hub{box-shadow:0 0 0 10px color-mix(in srgb,var(--c) 18%,transparent)}
.imline{font-family:var(--ff-sans);font-weight:400;font-size:clamp(23px,1rem + 1.15vw,36px);line-height:1.28;letter-spacing:-.012em;text-align:center;text-wrap:balance;
  max-width:30ch;margin:clamp(18px,3vw,40px) auto 6px;color:#fff;transition:opacity 1s .1s var(--ease),transform 1s .1s var(--ease)}
.work[data-v=imagine] .beginw{transition:opacity .9s .55s var(--ease),transform .9s .55s var(--ease)}
.work[data-v=imagine] .chg{align-self:center;color:rgba(255,255,255,.8);transition:opacity .8s .9s var(--ease)}
.work[data-v=imagine] .gobtn.begin{background:#fff;color:var(--ink)}
.work[data-pend] .imline,.work[data-pend] .beginw{opacity:0;transform:translateY(14px);transition:none}
.work[data-pend] .chg{opacity:0;transition:none}
.work[data-pend] .pickhd{opacity:0}
.pickhd{transition:opacity .8s var(--ease)}
.work[data-v=imagine] .pbody.enter>*{animation:none}

/* the iceberg on Imagine: big and faint behind everything, its tip still out of sight above */
.work[data-v=imagine] .berg{position:absolute;left:50%;top:-40px;width:min(1180px,108%);transform:translateX(-50%);z-index:0;pointer-events:none;background:transparent;opacity:1;
  transition:opacity 2.2s 1.2s var(--ease)}
.work[data-v=imagine] .berg .bgd{background:transparent!important;overflow:visible}
.work[data-v=imagine] .berg svg{max-height:none!important;width:100%;translate:0 -27%;transition:translate 2.8s .6s cubic-bezier(.45,0,.25,1)}
.work[data-v=imagine] .berg .sky,.work[data-v=imagine] .berg .sea,.work[data-v=imagine] .berg .lab,.work[data-v=imagine] .berg #mk,.work[data-v=imagine] .berg .cnt,
.work[data-v=imagine] .berg .bt,.work[data-v=imagine] .berg .dl,.work[data-v=imagine] .berg .dim,.work[data-v=imagine] .berg .floe2,.work[data-v=imagine] .legend,
.work[data-v=imagine] .bpop,.work[data-v=imagine] .berg .tip,.work[data-v=imagine] .berg .wave{display:none!important}
.work[data-v=imagine] .berg .body{stroke:none!important;fill-opacity:.32}
.work[data-v=imagine] .berg .floe{opacity:.55}
.work[data-v=imagine] .berg .bub circle{opacity:.5}
.work[data-v=map] .berg svg{translate:0 6%}
@media(max-width:900px){.work[data-v=imagine] .berg{width:150%;top:0}}

/* ================= fill the screen: no wide light-blue margins on big displays ================= */
:root{--max:none}
.wrap{padding-left:max(clamp(8px,1.1vw,20px),env(safe-area-inset-left,0px));padding-right:max(clamp(8px,1.1vw,20px),env(safe-area-inset-right,0px))}
main{padding-block:clamp(6px,.8vw,12px) clamp(8px,1vw,16px)}
.mast{margin-top:clamp(6px,.8vw,12px)}
.work{min-height:calc(100svh - var(--toph,180px) - clamp(8px,1vw,16px))}
.work[data-layer] .panel{max-width:min(1100px,100%)}
@media(min-width:1700px){.work[data-layer] .layer{font-size:clamp(60px,4vw,96px)}.q.cols p{font-size:clamp(24px,1.25vw,30px)}.imline{font-size:clamp(34px,1.9vw,46px)}}
.imline{border-left:0!important;padding-left:0!important}
.work[data-v=imagine] .berg svg{-webkit-mask-image:linear-gradient(180deg,transparent 0,transparent 24%,#000 40%);mask-image:linear-gradient(180deg,transparent 0,transparent 24%,#000 40%)}
.work{min-height:calc(100svh - var(--toph,180px) - clamp(8px,1vw,16px))!important}
.strms{grid-template-columns:repeat(3,46px);gap:10px 14px}
.strmb{width:46px;height:46px;font-size:17px}
.stintro .stlead{font-size:15px}

<script type="application/json" id="experts">{"R06": [{"who": "Jiyeon Cho", "focus": "", "down": {"name": "", "card": "Powerful AI systems with their safety features removed are passed around freely online. The law only covers the companies that first build AI, not the people who change it afterwards. Nobody can trace who changed what. When harm happens, there is no one to hold to account, and trust in AI falls.", "surface": "Powerful AI with its safety features removed is handed on by middlemen nobody regulates. Dangerous abilities spread fast.", "under": "The rules don't say what the middlemen are responsible for. Nobody can track where an AI came from or how it was changed.", "core": ["Getting the benefits of AI matters more than safety. Smaller players who build on others' AI can't be expected to follow the same rules as the big companies.", "It's the maker's fault, not the fault of whoever changed it afterwards."]}, "up": {"name": "", "card": "Clear rules cover everyone who builds, changes or shares AI. Regulators have the skills and power to enforce them, and industry agrees traceability matters. If someone strips out safety features, it can be traced back to them. Openness and innovation carry on, and people trust AI more.", "surface": "Clear rules cover everyone in the chain, middlemen included.", "under": "Regulators are properly equipped, and the industry is on board.", "core": ["You can have open, innovative AI and safe AI at the same time.", "Growth only lasts if people can see who did what."]}}, {"who": "Omer Bilgin", "focus": "scams and cybercrime", "down": {"name": "", "card": "Downloadable AI is barely regulated. Criminals take it, remove its safety features and use it for scams and extortion. Governments care more about AI's promised economic benefits than about public safety. More and more people around the world are harmed.", "surface": "Downloadable AI is barely regulated. Criminals strip its safety features and misuse it.", "under": "Governments focus on the money AI could bring, not on keeping people safe.", "core": ["The fewer rules, the better.", "Leave it to the market and it will sort itself out."]}, "up": {"name": "", "card": "Enough harm has happened around the world that the public demands action. Governments agree that keeping people safe matters as much as economic gain. The most powerful downloadable AI is properly regulated everywhere. AI-driven cybercrime does not grow.", "surface": "The most powerful downloadable AI is properly regulated worldwide.", "under": "Enough harm happens that people and governments decide safety matters as much as money.", "core": ["Safety first, decided democratically.", "A government's first job is to protect its people."]}}], "R01": [{"who": "Clement Neo", "focus": "", "down": {"name": "Societal Chaos", "card": "Fake news campaigns run by AI keep societies unsettled. Governments change often, and hatred between groups is stirred up on purpose. Smaller countries are easy targets, because whoever is behind it can deny it. Like a game where hidden villains live among the townsfolk, everyone suspects everyone.", "surface": "Fake news campaigns keep politics and society unsettled.", "under": "Smaller countries are easy to interfere with. If nobody can prove who did it, nobody acts.", "core": ["", "Like the party game where hidden villains live among the townsfolk: everyone accuses everyone and nobody knows who to trust."]}, "up": {"name": "", "card": "Governments, tech companies and the public all take AI-driven fake news seriously, and they get good at spotting it. Maybe a scandal bigger than past election interference woke everyone up, or detection tools improved, or checking users became normal. Information wars are now treated as seriously as real wars. AI manipulation stops being a major problem.", "surface": "Everyone works together and is good at catching AI-made fakes.", "under": "Possible reasons: a huge scandal, better detection tools, or people getting used to proving they're real online.", "core": ["Fighting over what people believe is taken as seriously as fighting with weapons.", ""]}}], "R03": [{"who": "David Thorstad", "focus": "", "down": {"name": "", "card": "Regulators can't or won't act on children's use of AI. Most parents don't know about the harms, or don't care. Tech companies keep the issue out of the news. Children become hooked on AI tools, miss out on time with other people and see things they shouldn't.", "surface": "Regulators don't act. Parents don't know or don't care.", "under": "The companies have too much sway over regulators, and the public isn't paying attention.", "core": ["Politicians act on what's in the news, and companies keep this out of the news.", "Nobody sees, or nobody cares."]}, "up": {"name": "", "card": "A wave of public concern forces governments to regulate children's use of AI, and people keep paying attention after. Rules handle the big risks, and informed parents handle what rules can't. AI is mostly safe and useful for children. A generation grows up knowing how to use it well.", "surface": "Good rules, and parents who know what to watch for.", "under": "A wave of public concern forces action, and people keep caring.", "core": ["Parents care and will spot it when something's wrong.", "Worried parents make a noise, and it works."]}}], "R09": [{"who": "Dr Bani Mejda", "focus": "killing leaders", "down": {"name": "The Jungle of Unseen Predators", "card": "Every day the news reports another world leader killed or captured by drone swarms nobody can trace. AI targeting tools are cheap and sold on the dark web. Borders and treaties mean nothing. Leaders hide in bunkers, cut off from their people, and countries stop functioning.", "surface": "World leaders are killed or captured by drone swarms that nobody can trace.", "under": "The international controls collapse. AI targeting tools are cheap and easy to buy, so attacks cost almost nothing.", "core": ["The strongest wins. Borders and treaties are just paper.", "A jungle where the hunters are invisible."]}, "up": {"name": "The Digital Shield of Peace", "card": "The United Nations agrees a worldwide ban on using AI to target political leaders, and it's enforced. International inspectors can check military software anywhere. AI is used for defence and spotting threats instead of assassination. Diplomacy becomes predictable again.", "surface": "Order returns. AI is used for defence, not assassination.", "under": "A UN ban is agreed and enforced, with inspectors who can check military software anywhere.", "core": ["Technology must answer to human values, and a human must always be responsible.", "A shared shield that protects everyone."]}}], "R10": [{"who": "Su Cizem", "focus": "", "down": {"name": "", "card": "The superpowers race to automate their militaries with no shared limits and no emergency phone line. Decisions happen in seconds. A glitch or a misread signal tips into conflict before a human can step in. Smaller countries like Mamur's are hit first, but in the end the superpowers lose control too.", "surface": "No limits, no hotline, almost no humans involved. A glitch can start a war in seconds.", "under": "Everyone feared falling behind, so they cut humans out to go faster. Smaller countries had no say.", "core": ["Whoever has the fastest technology wins.", "A dirty fish tank that can't keep anything alive."]}, "up": {"name": "", "card": "There's a secure hotline between militaries, and an agreed way to say \"that was a glitch, not an attack\". Humans stay in charge of big decisions. Smaller countries trust the system and Mamur has a seat at the table. When something goes wrong, it's sorted out in minutes.", "surface": "A working hotline, a way to say \"it was an accident\", and humans in charge.", "under": "Everyone saw the shared danger. Smaller countries pushed, the big powers paid.", "core": ["Your safety and mine are the same.", "A clean tank everyone looks after together, where you can see what's going on."]}}, {"who": "Jason Hoelscher-Obermaier", "focus": "accidents at sea", "down": {"name": "Runaway Race", "card": "A ship carrying supplies to an Indonesian naval base is sunk. Nobody can prove who did it. China is suspected, denies it, and moves more forces into the region. Untraceable attacks by autonomous weapons become routine, and Indonesia becomes a testing ground.", "surface": "A ship is sunk. Nobody can prove who did it.", "under": "When nothing can be proved, being able to deny it is useful. Each attack is an excuse to build up more weapons.", "core": ["If you can't prove anything, only strength keeps you safe. Holding back means losing.", "In the dark, only the strong are safe."]}, "up": {"name": "Verified Restraint", "card": "A faulty drone threatens a tanker near disputed waters. The country that owns it spots the fault, stops it and reports it straight away. Indonesia is told in time to warn the ship. Officials publicly credit the agreement that made it possible.", "surface": "A faulty drone threatens a ship in disputed waters.", "under": "Binding limits, a shared and tamper-proof way to prove what happened, and countries like Indonesia kept informed.", "core": ["Accidents will happen, but they can be caught. You don't have to trust if you can check.", "Seatbelts at 200 mph: the race isn't slower, but crashes are survivable."]}}], "R11": [{"who": "Véronique Donard", "focus": "", "down": {"name": "", "card": "An attack planned by AI hits most major cities of a powerful country at once. Incurable diseases kill much of the population. The government forces emergency measures on people by law. The rest of the world watches, frozen.", "surface": "An AI-planned attack with deadly diseases hits a powerful country's cities. The world freezes.", "under": "AI weapons arrived before any rules. Racing to build the smartest AI replaced working for peace.", "core": ["Being human is outdated. The strongest own the technology.", "The end of the world, in a lawless wasteland."]}, "up": {"name": "The Good Shepherd", "card": "An AI built to spot rising weapons threats proposes a global plan. For the first time, world leaders, regulators and the public listen and choose cooperation over competition. Fear of extinction unites people instead of dividing them. The AI serves humanity, not the other way round.", "surface": "An AI warns of the danger and proposes a plan. Everyone listens and works together.", "under": "The AI saw what people couldn't, and shared fear brought everyone together.", "core": ["We can't save ourselves alone, but we can with AI that's on our side.", "A shepherd who guides the flock to safety."]}}], "R05": [{"who": "Kyungho Song", "focus": "", "down": {"name": "", "card": "Government safety testers only see AI systems on the companies' terms: limited access, short deadlines, selected information. As the race speeds up, even that shrinks. Testing looks like safety but doesn't deliver it. When harm happens, nobody is accountable.", "surface": "Testers only see what companies let them see, and less over time.", "under": "Governments put winning the race first. Lobbyists said rules would hurt the economy. Testers were never given real powers.", "core": ["Faster matters more than thorough. Doing a test is treated as proof of safety.", "Like greenwashing, but for safety: it looks safe without being safe."]}, "up": {"name": "", "card": "By law, AI companies must give government safety testers full access before and after release. Public computing power means testers don't rely on the companies. Promises have become binding international agreements. The testers check AI on their own terms and timetable.", "surface": "Companies must give testers full access by law, and testers have their own computing power.", "under": "Access to chips depends on being tested. Scandals beat the lobbyists. Promises became binding.", "core": ["Safety and progress go together. Proper checking benefits everyone.", "An inspector who can turn up unannounced."]}}], "R07": [{"who": "Kiriti Prasad Choudhury", "focus": "", "down": {"name": "", "card": "AI is now doing much of the work of building better AI. The US and China are racing, companies want results and global cooperation is weak. Humans are still \"in charge\" on paper, but can't really follow what's happening. Governments only react after things go wrong.", "surface": "AI builds AI. Human control is in name only.", "under": "A race between countries, pressure for profit, slow rules and safety work that can't keep up.", "core": ["Get ahead first, deal with the risks later.", "Racing blindfolded towards a cliff edge."]}, "up": {"name": "", "card": "AI advances quickly, but humans keep real control. Rival countries talk regularly about the biggest risks, share monitoring and work closely with regulators. Confidence comes from being able to see what the systems are doing. Even so, institutions still struggle to keep pace.", "surface": "Fast progress with real human control.", "under": "Rivals talk, share checks and work with regulators.", "core": ["Safety is part of doing AI properly.", "Trust comes from being able to see inside."]}}], "R12": [{"who": "Narjès Bellamine Ben Saoud", "focus": "", "down": {"name": "The boat in a storm", "card": "Maha has no simple way to find out if the AI her children use has harmed anyone. The few incident records are technical and only in English. Nobody coordinates anything. Families are left to work it out alone, and only the strongest \"swimmers\" stay safe.", "surface": "Parents can't find out what's gone wrong, and what exists is technical and in English only.", "under": "Nobody joins things up, locally or globally.", "core": ["Tracking harm isn't needed; if you use it, that's on you.", "A boat in a storm where only strong swimmers survive."]}, "up": {"name": "The calm boat", "card": "There's a shared, up-to-date record of AI incidents and what to do about them, linked across countries and adapted to local languages. Families like Maha's are kept informed. The crew and passengers trust each other. Everyone on the boat can get on with their lives.", "surface": "Harms are tracked and people are told what to do.", "under": "Shared, up-to-date records linked across countries.", "core": ["The people in charge and the public trust each other.", "A calm boat with a good crew."]}}, {"who": "Kritika Maheshwari", "focus": "", "down": {"name": "Blind men and the elephant", "card": "The same kind of AI harm keeps happening in different countries, but nobody links the cases. What counts as an incident in one place is a routine fault in another. Harms come to light only through journalists, whistleblowers and viral posts. Victims carry the cost alone, and the same harms repeat.", "surface": "The same harm happens everywhere, but nobody joins the dots.", "under": "Every country has its own definition. Harm only comes out through the press or social media.", "core": ["The cases aren't connected, and joining up means losing control to foreigners.", "Each person feels one part of the elephant and nobody sees the whole animal."]}, "up": {"name": "", "card": "When an AI harm happens anywhere, it's logged in a shared record that all countries can use. Reporting is compulsory, and someone is legally responsible. A harm recorded in one country helps prevent it in another. Affected communities have somewhere to seek justice.", "surface": "Every harm goes into a shared record, and reporting is compulsory.", "under": "The law requires reporting, and someone is held responsible.", "core": ["AI harm follows patterns we can see and prevent.", ""]}}]}</script>

/* set up: every cluster at home on the map */
function layoutMap(){
  measureMap();
  var wide=M.W>=900,ir=rectIn($('stintro')),ft=$('work').querySelector('.pfoot'),foot=ft?ft.offsetHeight:64;
  var reg=wide?{x:ir.x+ir.w,y:0,w:M.W-(ir.x+ir.w),h:M.H-foot}:{x:0,y:ir.y+ir.h,w:M.W,h:Math.max(260,M.H-(ir.y+ir.h)-foot)};
  var P=reg.w/reg.h<.8?PRE.P:PRE.W;
  var Rh=clamp(.2*Math.sqrt(reg.w*reg.h/6),40,118),marg=clamp(Rh*.3,14,30);
  var x0=reg.x+marg+Rh,y0=reg.y+marg+Rh,W0=Math.max(1,reg.w-2*(marg+Rh)),H0=Math.max(1,reg.h-2*(marg+Rh));
  M.Rh=Rh;
  M.hubs.forEach(function(H){
    var a=P.g[H.c.id];H.tx=x0+a[0]*W0;H.ty=y0+a[1]*H0;H.tr=Rh;H.to=1;
    H.c.risks.forEach(function(r,i){
      var q=M.sat[r],ang=a[2][i]*Math.PI/180;
      q.tr=Math.max(11,Rh*.3);q.dist=Rh+P.tg*Rh+q.tr;q.tx=H.tx+q.dist*Math.cos(ang);q.ty=H.ty+q.dist*Math.sin(ang);q.to=1;
      q.lab.style.width='';
    });
  });
  relax(reg,Rh,marg);
}
function relax(reg,Rh,marg){
  var N=[];
  M.hubs.forEach(function(H){N.push({o:H,hub:1,g:H.c.id,r:H.tr});});
  M.sats.forEach(function(q){N.push({o:q,hub:0,g:q.c.id,r:q.tr*1.2});});
  for(var it=0;it<240;it++){
    for(var i=0;i<N.length;i++)for(var j=i+1;j<N.length;j++){
      var a=N[i],b=N[j];
      if(a.g===b.g&&(a.hub||b.hub))continue;
      var gap=(a.hub&&b.hub)?Rh*.55:((a.hub||b.hub)?18:(a.g===b.g?12:16));
      var dx=b.o.tx-a.o.tx,dy=b.o.ty-a.o.ty,d=Math.sqrt(dx*dx+dy*dy)||.01,min=a.r+b.r+gap;
      if(d<min){var wa=a.hub?.25:1,wb=b.hub?.25:1,s=wa+wb,push=min-d,ux=dx/d,uy=dy/d;
        a.o.tx-=ux*push*wa/s;a.o.ty-=uy*push*wa/s;b.o.tx+=ux*push*wb/s;b.o.ty+=uy*push*wb/s;}
    }
    M.sats.forEach(function(q){var dx=q.tx-q.h.tx,dy=q.ty-q.h.ty,d=Math.sqrt(dx*dx+dy*dy)||1,k=(q.dist-d)/d*.6;q.tx+=dx*k;q.ty+=dy*k;});
    N.forEach(function(n){n.o.tx=clamp(n.o.tx,reg.x+marg+n.r,reg.x+reg.w-marg-n.r);n.o.ty=clamp(n.o.ty,reg.y+marg+n.r,reg.y+reg.h-marg-n.r);});
  }
}

/* imagine: the chosen cluster grows into its place by the script, the rest leave the frame */
function layoutImagine(){
  layoutMap();
  var C=S.cluster&&M.hub[S.cluster],spot=document.querySelector('#pbody .spot');
  var cx=C?C.tx:M.W/2,cy=C?C.ty:M.H/2,far=Math.max(M.W,M.H)*1.1;
  M.hubs.forEach(function(H){
    if(H===C)return;
    var dx=H.tx-cx,dy=H.ty-cy,d=Math.sqrt(dx*dx+dy*dy)||1,ox=dx/d*far,oy=dy/d*far;
    H.tx+=ox;H.ty+=oy;H.to=0;
    H.c.risks.forEach(function(r){var q=M.sat[r];q.tx+=ox;q.ty+=oy;q.to=0;});

  if(!C||!spot)return;

/* a curved tether from a cluster to one of its risks */
function tpath(H,q){

function kick(){if(M.run)return;M.run=true;M.last=0;requestAnimationFrame(frame);}
function frame(now){
  if(!M.run)return;
  var dt=M.last?Math.min(50,now-M.last):16;M.last=now;M.clock+=dt/1000;
  var kp=1-Math.exp(-dt/(REDUCE?40:190)),kr=1-Math.exp(-dt/(REDUCE?40:150)),ko=1-Math.exp(-dt/(REDUCE?40:170)),amp=(REDUCE||PRESENT)?0:1,T=M.clock;

    if(n.tw){
      if(n.tw.t0<0)n.tw.t0=T;
      var p=clamp((T-n.tw.t0)/n.tw.d,0,1),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;

    }else{
    n.x+=(n.tx-n.x)*kp;n.y+=(n.ty-n.y)*kp;n.r+=(n.tr-n.r)*kr;n.o+=(n.to-n.o)*ko;
    if(Math.abs(n.tx-n.x)<.05)n.x=n.tx;if(Math.abs(n.ty-n.y)<.05)n.y=n.ty;if(Math.abs(n.tr-n.r)<.04)n.r=n.tr;if(Math.abs(n.to-n.o)<.01)n.o=n.to;
    }

    n.el.style.transform='translate3d('+f1(n.X-n.r)+'px,'+f1(n.Y-n.r)+'px,0)';
    if(Math.abs(n.sz-n.r)>.2){n.sz=n.r;n.el.style.width=n.el.style.height=(2*n.r).toFixed(1)+'px';if(!n.h)n.el.style.setProperty('--hf',f1(clamp(n.r*.235,11,28))+'px');}
    n.el.style.opacity=n.o.toFixed(3);

  }
  M.hubs.forEach(ease);

    q.path.style.opacity=(Math.min(H.o,q.o)*base).toFixed(3);

      var w=q.lw||q.lab.offsetWidth,h=q.lh||q.lab.offsetHeight,x,y=q.Y-h/2;
      if(mine)x=q.X+q.r+18;
      else{var off=q.r+12;x=q.x>=H.x?q.X+off:q.X-off-w;x=clamp(x,8,M.W-w-8);y=clamp(y,8,M.H-h-8);}
      q.lab.style.transform='translate3d('+f1(x)+'px,'+f1(y)+'px,0)';
    }
  });
  var rmTo=M.mode==='map'?1:0;
  M.rooms.forEach(function(rm){
    var q=rm.q,H=q.h,a=Math.atan2(q.Y-H.Y,q.X-H.X)+rm.side*.68,rr=Math.max(9,q.r*.6),d=q.r+rr+3;
    rm.o+=(rmTo-rm.o)*ko;if(Math.abs(rmTo-rm.o)<.01)rm.o=rmTo;
    var o=rm.o*q.o;
    rm.el.style.transform='translate3d('+f1(q.X+Math.cos(a)*d-rr)+'px,'+f1(q.Y+Math.sin(a)*d-rr)+'px,0)';
    if(Math.abs(rm.sz-rr)>.2){rm.sz=rr;rm.el.style.width=rm.el.style.height=(2*rr).toFixed(1)+'px';rm.el.style.setProperty('--rf',f1(clamp(rr*.82,10,19))+'px');}

  });
  if(M.mode)requestAnimationFrame(frame);else M.run=false;
}

    if(v==='map')layoutMap();else layoutImagine();
    if(slow){var D=2.8;M.hubs.concat(M.sats).forEach(function(n){n.wait=0;n.tw={t0:-1,d:D,x:n.x,y:n.y,r:n.r,o:n.o};});}
