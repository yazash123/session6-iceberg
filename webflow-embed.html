<!-- Iceberg futures (Sessions 6 & 7): paste into ONE Webflow Code Embed, in a full-width section (not a Container). -->
<div id="hotp-ice-wrap" style="width:100%;margin:0;padding:0">
  <iframe id="hotp-ice"
    title="Iceberg futures: take your table's risk down the iceberg"
    data-src="https://yazash123.github.io/session6-iceberg/"
    allow="clipboard-write"
    style="display:block;width:100%;height:100vh;height:100dvh;border:0;background:#C0E8F8"></iframe>
</div>
<script>
(function(){
  var f=document.getElementById('hotp-ice'), base=f.getAttribute('data-src');
  // Table links: put #g1 to #g26 on the end of the Webflow page address.
  function pass(){
    var h=/^#g\d{1,2}$/.test(location.hash)?location.hash:'';
    if(f.getAttribute('src')!==base+h) f.setAttribute('src',base+h);
  }
  pass(); window.addEventListener('hashchange',pass);
})();
</script>
